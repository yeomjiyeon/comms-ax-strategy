<!DOCTYPE html>
<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F&amp;F Comms AX Strategy</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--surface:#fff;--surface-2:#f0f1f4;--border:#e2e5ea;--border-light:#d0d4dc;--text:#1a1d23;--text-sub:#4a5068;--text-dim:#8590a6;--accent:#2563eb;--accent-dim:rgba(37,99,235,.08);--green:#16a34a;--green-bg:rgba(22,163,74,.06);--green-bdr:rgba(22,163,74,.2);--blue:#2563eb;--blue-bg:rgba(37,99,235,.06);--blue-bdr:rgba(37,99,235,.2);--yellow:#ca8a04;--yellow-bg:rgba(202,138,4,.06);--yellow-bdr:rgba(202,138,4,.2);--purple:#9333ea;--purple-bg:rgba(147,51,234,.06);--purple-bdr:rgba(147,51,234,.2);--red:#dc2626;--red-bg:rgba(220,38,38,.06);--navy:#1e3a5f}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}.page{max-width:1500px;margin:0 auto;padding:44px 32px 70px}
.ed{font-family:inherit;border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 7px;width:100%;outline:none;transition:border-color .12s}.ed:hover{border-color:var(--border)}.ed:focus{border-color:var(--accent);background:var(--accent-dim)}
.ed-w{font-family:inherit;border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 7px;width:100%;outline:none;color:rgba(255,255,255,.8);transition:border-color .12s}.ed-w:hover{border-color:rgba(255,255,255,.15)}.ed-w:focus{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.06)}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:0;padding-bottom:20px;border-bottom:1px solid var(--border)}.hdr h1{font-family:'Outfit';font-size:30px;font-weight:700;letter-spacing:-.5px}.hdr h1 em{font-style:normal;color:var(--accent)}.hdr .sub{font-size:15px;color:var(--text-dim);margin-top:5px}.hdr-r{text-align:right}.hdr-r .dt{font-family:'Outfit';font-size:14px;color:var(--text-dim)}
.btn{padding:9px 20px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-sub);font-family:'Noto Sans KR';transition:all .15s;display:inline-flex;align-items:center;gap:5px}.btn:hover{border-color:var(--accent);color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
/* Tabs */
.tabs{display:flex;gap:0;margin:22px 0 30px;border-bottom:2px solid var(--border)}.tab{padding:14px 32px;font-size:16px;font-weight:600;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:'Outfit';letter-spacing:.3px}.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}.tab-content{display:none}.tab-content.active{display:block}
/* Roadmap styles */
.phases-bar{display:flex;border-radius:14px 14px 0 0;overflow:hidden;border:1px solid var(--border);border-bottom:none}
.ph{text-align:center;padding:20px 14px 18px}.ph .ph-ed-num{font-family:'Outfit';font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.4;text-align:center}.ph .ph-ed-label{font-family:'Outfit';font-size:26px;font-weight:800;text-align:center;letter-spacing:-.3px}.ph .ph-ed-sub{font-size:13px;color:var(--text-dim);text-align:center}
.ph.p1{flex:1;background:linear-gradient(180deg,rgba(22,163,74,.06),transparent)}.ph.p1 .ph-ed-label{color:var(--green)}.ph.p2{flex:1.5;background:linear-gradient(180deg,rgba(37,99,235,.06),transparent);border-left:2px dashed var(--border)}.ph.p2 .ph-ed-label{color:var(--blue)}.ph.p3{flex:1;background:linear-gradient(180deg,rgba(147,51,234,.03),transparent);border-left:2px dashed var(--border)}.ph.p3 .ph-ed-label{color:var(--purple)}
.rm-wrap{background:var(--surface);border:1px solid var(--border);border-radius:0 0 14px 14px;box-shadow:0 2px 8px rgba(0,0,0,.04);overflow-x:auto}
.grid{display:grid;grid-template-columns:180px 1fr 1.5fr 1.2fr;min-width:900px}
.col-hdr{padding:14px 10px;text-align:center;font-family:'Outfit';font-size:15px;font-weight:700;color:var(--text-sub);border-bottom:1px solid var(--border);background:var(--surface-2)}.col-hdr:not(:first-child){border-left:1px solid var(--border)}.col-hdr.cur{color:var(--accent);background:rgba(37,99,235,.03)}.col-hdr.fut{color:var(--purple)}
.row-label{padding:10px 8px;border-bottom:1px solid var(--border);background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.rl-ed-icon{font-size:20px;width:36px;text-align:center;padding:0;border:none;background:none;outline:none}
.rl-ed-name{font-size:14px;font-weight:600;color:var(--text);font-family:'Noto Sans KR';border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 6px;width:100%;outline:none;resize:none;min-height:22px;line-height:1.4;overflow:hidden}.rl-ed-name:hover{border-color:var(--border)}.rl-ed-name:focus{border-color:var(--accent);background:var(--accent-dim)}
.rl-ed-sub{font-size:12px;color:var(--text-dim);font-family:'Noto Sans KR';border:1px solid transparent;background:transparent;border-radius:4px;padding:2px 6px;width:100%;outline:none;resize:none;min-height:18px;line-height:1.4;overflow:hidden}.rl-ed-sub:hover{border-color:var(--border)}.rl-ed-sub:focus{border-color:var(--accent);background:var(--accent-dim)}
.cell{padding:10px 8px;border-bottom:1px solid var(--border);border-left:1px solid var(--border);min-height:80px;position:relative}.cell.cur-col{background:rgba(37,99,235,.01)}.cell.fut-col{background:rgba(147,51,234,.015)}
.card{position:relative;padding:9px 12px 9px 32px;border-radius:8px;margin-bottom:6px;font-size:13px;font-weight:500;line-height:1.4;border:1px solid transparent;transition:transform .1s,box-shadow .1s;cursor:default}.card:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.06)}
.card .ci{position:absolute;left:10px;top:10px;font-size:13px}.card .cs{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%}
.card.done{background:var(--green-bg);border-color:var(--green-bdr);color:var(--green)}.card.done .cs{background:var(--green)}.card.prog{background:var(--blue-bg);border-color:var(--blue-bdr);color:var(--blue)}.card.prog .cs{background:var(--blue)}.card.plan{background:var(--yellow-bg);border-color:var(--yellow-bdr);color:var(--yellow)}.card.plan .cs{background:var(--yellow)}
.c-sel{position:absolute;top:3px;right:14px;font-size:10px;padding:2px 4px;border-radius:6px;border:none;background:transparent;cursor:pointer;outline:none;font-family:'Noto Sans KR';opacity:0;transition:opacity .1s;appearance:none;-webkit-appearance:none}.card:hover .c-sel{opacity:1}
.c-del{position:absolute;bottom:2px;right:4px;width:18px;height:18px;border-radius:4px;border:none;background:transparent;color:inherit;cursor:pointer;font-size:10px;display:none;align-items:center;justify-content:center;opacity:.5}.card:hover .c-del{display:flex}.c-del:hover{background:var(--red-bg);color:var(--red);opacity:1}
.c-ed-t{font-size:13px;font-weight:500;color:inherit;background:transparent;border:1px solid transparent;border-radius:4px;padding:1px 4px;width:calc(100% - 4px);outline:none}.c-ed-t:hover{border-color:rgba(0,0,0,.1)}.c-ed-t:focus{border-color:var(--accent);background:rgba(255,255,255,.8);color:var(--text)}
.c-ed-who{display:block;font-size:12px;color:var(--text-dim);font-weight:400;margin-top:3px;font-family:'Noto Sans KR';border:1px solid transparent;background:transparent;border-radius:4px;padding:2px 5px;width:100%;outline:none}.c-ed-who:hover{border-color:var(--border)}.c-ed-who:focus{border-color:var(--accent);background:var(--accent-dim);color:var(--text-sub)}.c-ed-who::placeholder{color:var(--border-light)}
.add-btn{width:100%;padding:6px;border-radius:6px;border:1px dashed var(--border);background:transparent;color:var(--text-dim);font-size:13px;cursor:pointer;font-family:'Noto Sans KR';transition:all .1s;margin-top:3px}.add-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.fut-ed{font-size:13px;color:var(--text-dim);line-height:1.7;width:100%;min-height:60px;resize:vertical;font-family:'Noto Sans KR';border:1px solid transparent;background:transparent;border-radius:4px;padding:6px 8px;outline:none}.fut-ed:hover{border-color:var(--border)}.fut-ed:focus{border-color:var(--accent);background:var(--accent-dim)}
.bottom-area{grid-column:1/-1}
.summary-row{display:flex;gap:12px;padding:16px 18px;border-top:1px solid var(--border)}
.sm-block{flex:1;text-align:center;padding:14px 8px;border-radius:10px;background:var(--surface-2)}.sm-block .sm-num{font-family:'Outfit';font-size:28px;font-weight:800}.sm-block .sm-label{font-size:13px;color:var(--text-dim);margin-top:3px}
.legend{display:flex;gap:18px;justify-content:center;padding:14px 0;border-top:1px solid var(--border);font-size:13px;color:var(--text-dim)}.legend span{display:flex;align-items:center;gap:5px}.legend .ld{width:9px;height:9px;border-radius:50%}
.sec-title{font-family:'Outfit';font-size:22px;font-weight:700;color:var(--text);margin:36px 0 18px;display:flex;align-items:center;gap:10px}.sec-title .st-bar{width:4px;height:24px;border-radius:2px;background:var(--accent)}
.tr-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.tr-header{display:grid;grid-template-columns:1.8fr 1.2fr 30px 1.3fr 30px 1.3fr 28px;padding:10px 14px;font-size:13px;font-weight:600;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--border);margin-bottom:6px}
.tr-row{display:grid;grid-template-columns:1.8fr 1.2fr 30px 1.3fr 30px 1.3fr 28px;padding:10px 14px;border-radius:8px;align-items:center;margin-bottom:3px;transition:background .1s}.tr-row:hover{background:var(--surface-2)}
.tr-arrow{text-align:center;font-size:14px;color:var(--text-dim)}
.tr-del{width:24px;height:24px;border-radius:5px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .1s}.tr-row:hover .tr-del{opacity:1}.tr-del:hover{background:var(--red-bg);color:var(--red)}
.tr-add-btn{width:100%;padding:10px;border-radius:8px;border:1px dashed var(--border);background:transparent;color:var(--text-dim);font-size:14px;cursor:pointer;font-family:'Noto Sans KR';transition:all .12s;margin-top:10px}.tr-add-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.time-section{margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}.time-bar{height:32px;border-radius:8px;background:var(--surface-2);overflow:hidden;display:flex;margin-bottom:5px}.time-fill{height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff}
.time-legend{display:flex;gap:16px;font-size:12px;color:var(--text-dim);margin-top:8px;flex-wrap:wrap}.time-legend span{display:flex;align-items:center;gap:5px}.time-legend .tl-dot{width:10px;height:10px;border-radius:50%}
/* R&R */
.rr-org{display:flex;flex-direction:column;align-items:center;margin-bottom:40px}
.rr-lead{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:28px 40px;text-align:center;width:460px;box-shadow:0 4px 20px rgba(0,0,0,.06);position:relative;overflow:hidden}
.rr-lead::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--accent)}
.rr-connector{width:2px;height:32px;background:var(--border)}.rr-branch{position:relative;width:100%}
.rr-members{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:28px;width:100%;max-width:1200px}
.rr-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}.rr-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.06)}
.rr-card .rc-stripe{position:absolute;top:0;left:0;right:0;height:4px}
.c-green .rc-stripe{background:var(--green)}.c-slate .rc-stripe{background:#475569}.c-amber .rc-stripe{background:var(--yellow)}.c-purple .rc-stripe{background:var(--purple)}
.rr-duty-row{display:flex;align-items:center;gap:5px;margin-bottom:3px}.rr-duty-row .duty-del{width:18px;height:18px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:11px;border-radius:4px;display:none;align-items:center;justify-content:center;flex-shrink:0}.rr-duty-row:hover .duty-del{display:flex}.rr-duty-row .duty-del:hover{background:var(--red-bg);color:var(--red)}
.duty-add{font-size:12px;color:var(--text-dim);cursor:pointer;border:1px dashed var(--border);background:transparent;border-radius:5px;padding:4px 10px;font-family:'Noto Sans KR';margin-top:5px;transition:all .1s}.duty-add:hover{border-color:var(--accent);color:var(--accent)}
.rr-lead .duty-add{border-color:var(--border);color:var(--text-dim)}.rr-lead .duty-add:hover{border-color:var(--accent);color:var(--accent)}.rr-lead .duty-del{color:var(--text-dim)!important}.rr-lead .duty-del:hover{background:var(--red-bg)!important;color:var(--red)!important}
/* Notion tab — roadmap-grid 포맷 */
.n-summary{display:flex;gap:14px;margin-bottom:22px}
.n-sm{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.03)}.n-sm .n-num{font-family:'Outfit';font-size:40px;font-weight:800}.n-sm .n-label{font-size:14px;color:var(--text-dim);margin-top:4px}.n-sm .n-bar{height:5px;border-radius:3px;margin-top:14px;background:var(--surface-2);overflow:hidden}.n-sm .n-bar-fill{height:100%;border-radius:3px;transition:width .6s}
.n-progress{text-align:center;margin-bottom:18px;font-size:14px;color:var(--text-sub)}.n-progress strong{color:var(--accent)}
.n-filters{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.n-fbtn{padding:8px 18px;border-radius:22px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-sub);font-family:'Noto Sans KR';transition:all .12s}.n-fbtn:hover{border-color:var(--accent);color:var(--accent)}.n-fbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
/* Notion grid — same structure as Roadmap grid */
.ng-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.04);overflow-x:auto}
.ng-grid{display:grid;grid-template-columns:200px repeat(3,1fr);min-width:860px}
.ng-col-hdr{padding:14px 10px;text-align:center;font-family:'Outfit';font-size:15px;font-weight:700;color:var(--text-sub);border-bottom:1px solid var(--border);background:var(--surface-2)}.ng-col-hdr:not(:first-child){border-left:1px solid var(--border)}
.ng-row-label{padding:12px 10px;border-bottom:1px solid var(--border);background:var(--surface-2);display:flex;flex-direction:column;gap:3px}.ng-row-top{display:flex;align-items:center;gap:8px}.ng-row-icon{font-size:20px;flex-shrink:0}.ng-row-name{font-size:14px;font-weight:600;color:var(--text);word-break:break-word;flex:1;min-width:0}.ng-row-cnt{font-size:12px;color:var(--text-dim);margin-left:auto;white-space:nowrap}.ng-row-sub{font-size:12px;color:var(--text-dim);line-height:1.5;padding-left:28px;word-break:break-word}
.ng-cell{padding:10px 8px;border-bottom:1px solid var(--border);border-left:1px solid var(--border);min-height:70px;vertical-align:top}
.ng-cell.drag-over{background:var(--accent-dim);border:2px dashed var(--accent);border-radius:6px}
.ng-card{position:relative;padding:9px 12px 9px 28px;border-radius:8px;margin-bottom:6px;font-size:13px;font-weight:500;line-height:1.4;border:1px solid transparent;transition:transform .1s,box-shadow .1s;cursor:default}.ng-card:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.06)}
.ng-card.draggable{cursor:grab}.ng-card.draggable:active{cursor:grabbing}
.ng-card.dragging{opacity:.4;transform:scale(.95)}
.ng-card .nci{position:absolute;left:9px;top:10px;font-size:12px}.ng-card .ncs{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%}
.ng-card.done{background:var(--green-bg);border-color:var(--green-bdr);color:var(--green)}.ng-card.done .ncs{background:var(--green)}
.ng-card.prog{background:var(--blue-bg);border-color:var(--blue-bdr);color:var(--blue)}.ng-card.prog .ncs{background:var(--blue)}
.ng-card.plan{background:var(--yellow-bg);border-color:var(--yellow-bdr);color:var(--yellow)}.ng-card.plan .ncs{background:var(--yellow)}
.ng-card-who{font-size:11px;opacity:.7;margin-top:2px}
.ng-empty{font-size:12px;color:var(--border-light);text-align:center;padding:14px 4px}
.ng-bottom{grid-column:1/-1}
.ng-summary-row{display:flex;gap:12px;padding:16px 18px;border-top:1px solid var(--border)}
.ng-sm-block{flex:1;text-align:center;padding:14px 8px;border-radius:10px;background:var(--surface-2)}.ng-sm-block .sm-num{font-family:'Outfit';font-size:28px;font-weight:800}.ng-sm-block .sm-label{font-size:13px;color:var(--text-dim);margin-top:3px}
.ng-legend{display:flex;gap:18px;justify-content:center;padding:14px 0;border-top:1px solid var(--border);font-size:13px;color:var(--text-dim)}.ng-legend span{display:flex;align-items:center;gap:5px}.ng-legend .ld{width:9px;height:9px;border-radius:50%}
.ng-uncat{margin-top:18px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.ng-uncat-hdr{font-family:'Outfit';font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.n-loading{text-align:center;padding:80px 20px;color:var(--text-dim);font-size:16px}.n-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}
.n-error{background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.2);border-radius:12px;padding:24px;text-align:center}.n-error .ne-t{font-size:18px;font-weight:600;color:#dc2626;margin-bottom:8px}.n-error .ne-m{font-size:14px;color:var(--text-sub);line-height:1.7}
/* Notion edit mode */
.ng-card .n-st-sel{position:absolute;top:3px;right:14px;font-size:10px;padding:2px 4px;border-radius:6px;border:none;background:transparent;cursor:pointer;outline:none;font-family:'Noto Sans KR';opacity:0;transition:opacity .1s;appearance:none;-webkit-appearance:none}.ng-card:hover .n-st-sel{opacity:1}
.ng-card .n-del-btn{position:absolute;bottom:2px;right:4px;width:18px;height:18px;border-radius:4px;border:none;background:transparent;color:inherit;cursor:pointer;font-size:10px;display:none;align-items:center;justify-content:center;opacity:.5}.ng-card:hover .n-del-btn{display:flex}.n-del-btn:hover{background:var(--red-bg);color:var(--red);opacity:1}
.n-add-task{width:100%;padding:6px;border-radius:6px;border:1px dashed var(--border);background:transparent;color:var(--text-dim);font-size:13px;cursor:pointer;font-family:'Noto Sans KR';transition:all .1s;margin-top:3px}.n-add-task:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
/* Outfit font for key labels */
.ng-col-hdr,.ng-row-cnt,.n-num,.sm-num,.sec-title span{font-family:'Outfit',sans-serif}
/* Common */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 28px;border-radius:8px;font-size:15px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100}.toast.show{opacity:1}

<body>
<div class="page">
  <div class="hdr"><div><h1 id="pageTitle" contenteditable="false">Comms <em>AX</em> Strategy</h1><div class="sub" id="pageSub" contenteditable="false">커뮤니케이션팀 AI 전환 전략 · 2026</div></div><div class="hdr-r"><div class="dt" id="kstDate">2026. 04. 01 기준 (KST)</div><div style="font-size:12px;color:var(--text-dim);margin-top:4px" id="syncStatus">마지막 동기화: 13:25</div></div></div>
  <div class="tabs">
    <div class="tab" data-tab="notion"><span class="tab-label" id="tabLabel-notion" contenteditable="false">과제현황 (Notion)</span></div>
    <div class="tab active" data-tab="rnr"><span class="tab-label" id="tabLabel-rnr" contenteditable="false">R&amp;R</span></div>
  </div>
    <div class="tab-content" id="tab-notion"><div id="notionContent"></div></div>
  <div class="tab-content active" id="tab-rnr"><div id="rrContent"></div></div></div></div>
</div>
<div class="toast" id="toast">삭제</div>
<script>
// ╔══════════════════════════════════════════════════════════╗
// ║  Google Apps Script 배포 URL                              ║
// ║  ⚠ 아래 URL을 본인의 Apps Script 웹앱 URL로 교체하세요      ║
// ╚══════════════════════════════════════════════════════════╝
const API_URL = 'https://script.google.com/macros/s/AKfycbxI1M05PAJYmyjG8oeQFZic8yH9ZgAdM2cJkCWXD6R30p9zoJs7HnBcSc80HKFbunl1Lg/exec';
const STORAGE_KEY = 'fnf_comms_ax_dashboard';

// ══ 전체 상태를 하나의 객체로 수집 ══
function collectState() {
  return {
    nTasks: nTasks,
    trans: trans,
    rr: rr,
    timeBars: timeBars,
    CATS: CATS.map(c => ({key:c.key, icon:c.icon, sub:c.sub, aliases:c.aliases})),
    N_PERIODS: N_PERIODS.map(p => ({id:p.id, label:p.label, month:p.month, aliases:p.aliases})),
    meta: {
      pageTitle: document.getElementById('pageTitle')?.innerHTML || '',
      pageSub: document.getElementById('pageSub')?.innerHTML || '',
      tabNotion: document.getElementById('tabLabel-notion')?.innerHTML || '',
      tabRnr: document.getElementById('tabLabel-rnr')?.innerHTML || '',
    },
    savedAt: new Date().toISOString()
  };
}

// ══ 상태 적용 (로드된 데이터를 화면에 반영) ══
function applyState(state) {
  if (!state) return false;
  try {
    if (state.nTasks) { nTasks.length = 0; state.nTasks.forEach(t => nTasks.push(t)); }
    if (state.trans) { trans.length = 0; state.trans.forEach(t => trans.push(t)); }
    if (state.rr) { rr.lead = state.rr.lead; rr.members = state.rr.members; }
    if (state.timeBars) { timeBars.length = 0; state.timeBars.forEach(b => timeBars.push(b)); }
    if (state.CATS) {
      state.CATS.forEach((sc, i) => {
        if (CATS[i]) { CATS[i].key = sc.key; CATS[i].icon = sc.icon; CATS[i].sub = sc.sub; CATS[i].aliases = sc.aliases; }
      });
    }
    if (state.N_PERIODS) {
      state.N_PERIODS.forEach((sp, i) => {
        if (N_PERIODS[i]) { N_PERIODS[i].label = sp.label; N_PERIODS[i].month = sp.month; N_PERIODS[i].aliases = sp.aliases; }
      });
    }
    if (state.meta) {
      const pt = document.getElementById('pageTitle');
      const ps = document.getElementById('pageSub');
      const tn = document.getElementById('tabLabel-notion');
      const tr = document.getElementById('tabLabel-rnr');
      if (pt && state.meta.pageTitle) pt.innerHTML = state.meta.pageTitle;
      if (ps && state.meta.pageSub) ps.innerHTML = state.meta.pageSub;
      if (tn && state.meta.tabNotion) tn.innerHTML = state.meta.tabNotion;
      if (tr && state.meta.tabRnr) tr.innerHTML = state.meta.tabRnr;
    }
    return true;
  } catch(e) {
    console.error('상태 적용 오류:', e);
    return false;
  }
}

// ══ localStorage 캐시 (오프라인/빠른 로딩용) ══
function saveToCache(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function loadFromCache() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

// ══ Google Sheets 저장 (POST form 방식 - URL 길이 제한 우회) ══
async function saveToCloud() {
  _syncStatus = 'saving'; updateSyncBadge();
  const state = collectState();
  saveToCache(state);
  try {
    // Google Apps Script는 form POST만 CORS 없이 받을 수 있음
    const formData = new URLSearchParams();
    formData.append('action', 'saveAll');
    formData.append('data', JSON.stringify(state));
    const r = await fetch(API_URL, {
      method: 'POST',
      body: formData,
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    if (text.includes('<!DOCTYPE') || text.includes('<html')) throw new Error('리다이렉트');
    const d = JSON.parse(text);
    if (!d.success) throw new Error(d.error || '저장 실패');
    _syncStatus = 'saved'; updateSyncBadge();
    const ss = document.getElementById('syncStatus');
    if (ss) {
      const now = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
      ss.textContent = '마지막 동기화: ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    }
    setTimeout(() => { if (_syncStatus === 'saved') { _syncStatus = 'idle'; updateSyncBadge(); } }, 2000);
  } catch(err) {
    console.error('클라우드 저장 오류:', err);
    _syncStatus = 'error'; updateSyncBadge();
  }
}

// ══ Google Sheets에서 로드 (최대 3회 재시도) ══
async function loadFromCloud(retries = 3) {
  for (let i = 0; i < retries; i++) {
    try {
      const r = await fetch(API_URL + '?action=loadAll');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const text = await r.text();
      // Google 로그인 페이지 리다이렉트 감지
      if (text.includes('<!DOCTYPE html>') || text.includes('<html')) throw new Error('HTML 응답 (리다이렉트)');
      const d = JSON.parse(text);
      if (d.success && d.state) {
        saveToCache(d.state);
        return d.state;
      }
      return null; // success지만 state 없음 (첫 사용)
    } catch(err) {
      console.warn(`클라우드 로드 시도 ${i+1}/${retries} 실패:`, err.message);
      if (i < retries - 1) await new Promise(r => setTimeout(r, 1500)); // 1.5초 대기 후 재시도
    }
  }
  console.error('클라우드 로드 최종 실패');
  return null;
}

// ══ 초기 로드: 기본 데이터 먼저 표시 → 클라우드 시도 ══
async function initLoad() {
  const ss = document.getElementById('syncStatus');
  if (ss) ss.textContent = '데이터 로딩 중...';

  // 1) 먼저 기본 데이터(또는 캐시)로 빠르게 화면 표시
  const cached = loadFromCache();
  if (cached) applyState(cached);
  renderRR(); renderNotion();

  // 2) 클라우드에서 최신 데이터 가져오기 (백그라운드)
  const cloud = await loadFromCloud();
  if (cloud) {
    applyState(cloud);
    renderRR(); renderNotion();
    if (ss) {
      const now = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
      ss.textContent = '마지막 동기화: ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    }
  } else {
    // 클라우드 실패해도 기본 데이터/캐시로 정상 작동
    if (ss) {
      const now = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
      ss.textContent = '오프라인 · ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    }
  }
  _initDone = true;
}

function exportJSON() {
  const state = collectState();
  const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'comms_ax_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('💾 백업 파일 다운로드 완료');
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const state = JSON.parse(text);
      applyState(state);
      saveToCache(state);
      renderRR(); renderNotion();
      toast('✓ 복원 완료, 클라우드에 저장 중...');
      await saveToCloud();
    } catch(err) {
      toast('⚠ 파일 읽기 실패');
    }
  };
  input.click();
}

function resetToDefault() {
  if (!confirm('모든 수정사항을 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

// 디바운스 자동 저장 (클라우드 + 캐시)
let _autoSaveTimer = null;
let _initDone = false; // 초기 로드 완료 전에는 autoSave 차단
function autoSave() {
  if (!_initDone) return; // 초기 로드 중에는 저장하지 않음
  if (_autoSaveTimer) clearTimeout(_autoSaveTimer);
  _syncStatus = 'saving';
  updateSyncBadge();
  _autoSaveTimer = setTimeout(() => saveToCloud(), 1500);
}

// KST date
(function(){const n=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));document.getElementById('kstDate').textContent=n.getFullYear()+'. '+String(n.getMonth()+1).padStart(2,'0')+'. '+String(n.getDate()).padStart(2,'0')+' 기준 (KST)'})();
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function esc(s){return(s||'').replace(/"/g,'&quot;')}
function autoResize(el){el.style.height='auto';el.style.height=el.scrollHeight+'px'}
// Tabs
document.querySelectorAll('.tab').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));tab.classList.add('active');document.getElementById('tab-'+tab.dataset.tab).classList.add('active')})});

// ═══ STATUS LABELS ═══
const ST={done:'완료',prog:'진행 중',plan:'개발 예정'};
const SL={done:'완료',prog:'진행 중',plan:'개발 예정'};
const trans=[{name:'데일리 뉴스 클리핑',before:'에이전시',mid:'AI 자동화 + 기존 방식',after:'Agent 자율 실행 (Green)'},{name:'보도자료 작성',before:'에이전시 + 내부 직원',mid:'AI 자동화 + 기존 방식',after:'AI 초안 + 내부 검수 30분'},{name:'미디어 커버리지 집계',before:'에이전시 ',mid:'AI 자동화 + 기존 방식',after:'Agent 자율 갱신 (Green)'},{name:'사내 콘텐츠 제작',before:'내부 직원 + 에이전시 일부',mid:'AI 자동화 + 기존 방식 ',after:'Agent 자율 발행 (Green)'},{name:'KPI 리포트 작성',before:'에이전시 + 내부 직원',mid:'AI 자동화 + 기존 방식',after:'Agent 자율 갱신 + 브리핑 생성'},{name:'리스크 모니터링',before:'내부 직원 + 에이전시 일부',mid:'AI 자동화 + 기존 방식',after:'Agent 자율 탐지 → Amber 에스컬레이션'},{name:'기자 관계 관리',before:'내부 직원 (대면, 식사)',mid:'내부 직원 (불변)',after:'내부 직접 + Agent 점수 관리'},{name:'위기 커뮤니케이션',before:'내부 직원 + 에이전시',mid:'내부 직원 + 기존 방식',after:'Swarm 대응 패키지 → 인간 판단 (Red)'},{name:'경영진 보고',before:'내부 직원',mid:'AI 자동화 + 내부 직원 ',after:'Agent 브리핑 생성 → 팀장 검토 (Amber)'},{name:'ESG 보고서',before:'외부 컨설팅 + 내부 직원',mid:'외부 컨설팅 + AI 수집 병행',after:'AI 수집·초안 + 검수·소통'},{name:'경쟁사 PR 분석',before:'수동 (여유 없음)',mid:'AI 뉴스 수집',after:'Agent 자율 분석 + SOV 추적 (Green)'}];
function renderTR(){const tb=document.getElementById('transBody');if(!tb)return;tb.innerHTML=trans.map((t,i)=>`<div class="tr-row"><div><input class="ed" style="font-size:14px;font-weight:500;color:var(--text)" value="${esc(t.name)}" data-tf="name" data-ti="${i}"></div><div><input class="ed" style="font-size:13px" value="${esc(t.before)}" data-tf="before" data-ti="${i}"></div><div class="tr-arrow">→</div><div><input class="ed" style="font-size:13px;color:var(--accent);font-weight:500" value="${esc(t.mid)}" data-tf="mid" data-ti="${i}"></div><div class="tr-arrow">→</div><div><input class="ed" style="font-size:13px" value="${esc(t.after)}" data-tf="after" data-ti="${i}"></div><button class="tr-del" data-i="${i}">✕</button></div>`).join('');tb.addEventListener('input',e=>{const i=+e.target.dataset.ti,f=e.target.dataset.tf;if(isNaN(i)||!f)return;trans[i][f]=e.target.value;autoSave()})}

// ═══ R&R ═══
const defaultRR={lead:{name:'염지연 부장',title:'AX 총괄 / 전략 / 경영진 커뮤니케이션',duties:['AX 시스템 전체 설계 · 개발 · 고도화 총괄','팀 AX Transformation Lead','','']},members:[{name:'류영민 차장',pos:'미디어, 리스크 관리, ESG, CSR',color:'green',duties:['미디어 AX 전환 ','리스크 관리 AX 전환','ESG 및 CSR AX 전환 지원']},{name:'조혜진 과장',pos:'사내 PR, MPR, 링크드인, CEO',color:'slate',duties:['사내 PR, MPR AX 전환','링크드인, 외부채널 AX 전환','PR Hub Dashboard 고도화']},{name:'양정재 대리',pos:'미디어, 리스크 관리, ESG',color:'purple',duties:['미디어 AX 전환','리크 관리 AX 전환','ESG AX 전환']},{name:'표지수 담당',pos:'사내 PR, 미디어, ESG, CSR',color:'amber',duties:['사내 PR AX 전환','미디어 AX 전환(스폰서십)','CSR AX 전환']}]};
let rr=JSON.parse(JSON.stringify(defaultRR));const rrEl=document.getElementById('rrContent');
const cMap={green:'var(--green)',slate:'#475569',purple:'var(--purple)',amber:'var(--yellow)'};
function renderRR(){const L=rr.lead;const em=nEditMode;
let h=`<div class="rr-org"><div class="rr-lead"><div style="font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;opacity:.5;margin-bottom:8px">${em?`<input class="ed" style="font-size:12px;text-align:center;letter-spacing:1.5px;text-transform:uppercase;opacity:.5" value="Team Lead + AX Architect" data-t="lead" data-f="label">`:'Team Lead + AX Architect'}</div>${em?`<input class="ed" style="font-family:Outfit;font-size:26px;font-weight:700;text-align:center;color:var(--accent)" value="${esc(L.name)}" data-t="lead" data-f="name">`:`<div style="font-family:Outfit;font-size:26px;font-weight:700;text-align:center;color:var(--accent)">${L.name}</div>`}${em?`<input class="ed" style="font-size:14px;text-align:center;color:var(--text-dim)" value="${esc(L.title)}" data-t="lead" data-f="title">`:`<div style="font-size:14px;text-align:center;color:var(--text-dim)">${L.title}</div>`}<div style="text-align:left;margin-top:14px">${L.duties.map((d,di)=>`<div class="rr-duty-row">${em?`<input class="ed" style="font-size:13px;color:var(--text-sub)" value="${esc(d)}" data-t="lead" data-f="duty" data-di="${di}"><button class="duty-del" data-t="lead" data-di="${di}">✕</button>`:`<div style="font-size:13px;color:var(--text-sub)">· ${d}</div>`}</div>`).join('')}${em?`<button class="duty-add" data-t="lead">＋ 추가</button>`:''}</div></div><div class="rr-connector"></div><div class="rr-branch"><div style="position:absolute;top:0;left:calc(50% - 440px);right:calc(50% - 440px);height:2px;background:var(--border)"></div></div><div class="rr-members">`;
rr.members.forEach((m,mi)=>{h+=`<div class="rr-card c-${m.color}"><div class="rc-stripe"></div><div style="margin-top:8px">${em?`<input class="ed" style="font-family:Outfit;font-size:20px;font-weight:600" value="${esc(m.name)}" data-t="member" data-mi="${mi}" data-f="name">`:`<div style="font-family:Outfit;font-size:20px;font-weight:600">${m.name}</div>`}${em?`<input class="ed" style="font-size:13px;color:var(--text-dim)" value="${esc(m.pos)}" data-t="member" data-mi="${mi}" data-f="pos">`:`<div style="font-size:13px;color:var(--text-dim)">${m.pos}</div>`}</div><div style="margin-top:10px">${m.duties.map((d,di)=>`<div class="rr-duty-row"><div style="width:8px;height:8px;border-radius:50%;border:2px solid ${cMap[m.color]};flex-shrink:0"></div>${em?`<input class="ed" style="font-size:13px;color:var(--text-sub)" value="${esc(d)}" data-t="member" data-mi="${mi}" data-f="duty" data-di="${di}"><button class="duty-del" data-t="member" data-mi="${mi}" data-di="${di}">✕</button>`:`<div style="font-size:13px;color:var(--text-sub);padding:3px 6px">${d}</div>`}</div>`).join('')}${em?`<button class="duty-add" data-t="member" data-mi="${mi}">＋ 추가</button>`:''}</div></div>`});

function matchCat(t){const c=(t.category||'').toLowerCase(),n=(t.title||'').toLowerCase();for(const cat of CATS)for(const a of cat.aliases)if(c.includes(a.toLowerCase())||n.includes(a.toLowerCase()))return cat.key;return null}

// ★ 기간 컬럼 설정 (직접 수정 가능)
// ★ Roadmap 탭의 PERIODS와 동일한 구조
// ★ matchPhase 함수: 과제 데이터의 phase 필드로 매핑
// ★ phase 필드가 없으면 상태(done→p1, prog→p2, plan→p3)로 추정
// ────────────────────────────────────────────────────────
const N_PERIODS=[
  {id:'p1', label:'Phase 1 · 기반 구축',    month:'3월',   aliases:['phase 1','p1','3월','기반','완료']},
  {id:'p2', label:'Phase 2 · 통합·고도화',  month:'4~5월', aliases:['phase 2','p2','4월','5월','4~5월','통합','고도화','진행']},
  {id:'p3', label:'Phase 3 · Agent Harness',  month:'6월~',  aliases:['phase 3','p3','6월','확장','예정','harness','하네스']}
];
function matchPhase(t){
  const ph=(t.phase||'').toLowerCase();
  if(ph){for(const p of N_PERIODS)for(const a of p.aliases)if(ph.includes(a))return p.id}
  // phase 필드 없으면 상태로 추정
  if(t.status==='done')return 'p1';
  if(t.status==='prog')return 'p2';
  return 'p3';
}

let _syncStatus='idle'; // idle | saving | saved | error

function updateSyncBadge(){
  const el=document.getElementById('syncBadge');
  if(!el)return;
  if(_syncStatus==='saving'){el.textContent='저장 중...';el.style.color='var(--accent)'}

}

        h+=`<div class="ng-card ${t.status}" style="margin-bottom:6px"><span class="nci">●</span><div class="ncs"></div><input class="c-ed-t" value="${esc(t.title)}" data-nc="_uncat" data-ni="${ti}" data-nf="title"><input class="c-ed-who" value="${esc(who)}" placeholder="담당자" data-nc="_uncat" data-ni="${ti}" data-nf="assignee"><select class="c-sel n-st-sel" data-nc="_uncat" data-ni="${ti}">${stOpts}</select><button class="c-del n-del-btn" data-nc="_uncat" data-ni="${ti}">✕</button></div>`;
      } else {
        h+=`<div class="ng-card ${t.status}" style="margin-bottom:6px"><span class="nci">●</span><div class="ncs"></div><div style="padding-right:10px">${t.title}</div>${who?'<div class="ng-card-who">👤 '+who+'</div>':''}</div>`;
      }
    });
    h+=`</div>`;
  }

  if(!filtered.length)h+=`<div style="text-align:center;padding:60px;color:var(--text-dim)">해당 상태의 과제가 없습니다</div>`;

  // ── 주요 업무별 전환 현황 ──
  h+=`<div class="sec-title"><div class="st-bar"></div><span style="font-family:'Outfit'">주요 업무별 전환 현황</span></div><div class="tr-wrap"><div class="tr-header"><div>업무</div><div>현재</div><div></div><div>과도기</div><div></div><div style="font-family:'Outfit'">AX 전환 후</div><div></div></div><div id="transBody"></div><button class="tr-add-btn" id="trAddBtn">＋ 업무 항목 추가</button>`;
  // ── 업무 시간 구성 변화 ──
  h+=`<div class="time-section"><div style="font-size:14px;color:var(--text-sub);margin-bottom:10px;font-weight:500">업무 시간 구성 변화</div>`;
  timeBars.forEach((bar,bi)=>{
    h+=`<div style="font-size:13px;color:var(--text-dim);margin:${bi?'12px':'0'} 0 5px;font-weight:500">${nEditMode?`<input class="ed" style="font-size:13px;font-weight:500" value="${esc(bar.title)}" data-tbi="${bi}" data-tbf="title">`:`${bar.title}`}</div>`;
    h+=`<div class="time-bar">`;
    bar.segments.forEach((seg,si)=>{
      h+=`<div class="time-fill" style="width:${seg.pct}%;background:${seg.color};${seg.opacity?'opacity:'+seg.opacity:''}">${nEditMode?`<input style="background:none;border:none;color:#fff;font-size:11px;width:100%;text-align:center;outline:none;font-family:'Noto Sans KR'" value="${esc(seg.label)}" data-tbi="${bi}" data-tsi="${si}" data-tbf="label">`:`${seg.label}`}</div>`;
    });
    h+=`</div>`;
    if(nEditMode){
      h+=`<div style="display:flex;gap:4px;margin-top:3px">`;
      bar.segments.forEach((seg,si)=>{
        h+=`<input class="ed" style="font-size:11px;width:50px;text-align:center" value="${seg.pct}" data-tbi="${bi}" data-tsi="${si}" data-tbf="pct" placeholder="%">`;
      });
      h+=`</div>`;
    }
  });
  h+=`<div class="time-legend"><span><div class="tl-dot" style="background:#ef4444;opacity:.7"></div>수동 반복</span><span><div class="tl-dot" style="background:var(--purple);opacity:.7"></div>PR런 리테이너</span><span><div class="tl-dot" style="background:var(--yellow)"></div>AI+사람 협업</span><span><div class="tl-dot" style="background:var(--green)"></div>전략·관계</span><span><div class="tl-dot" style="background:var(--blue)"></div>신규 영역</span></div></div></div>`;

  nc.innerHTML=h;
  renderTR();
  // ── 드래그 앤 드롭 바인딩 (편집 모드에서만) ──
  if(nEditMode) initDragDrop();
}
// Helper: find task in nTasks grid by cat+phase+index
function findNTask(catKey,phaseId,idx){
  const filtered=nFilter==='all'?nTasks:nTasks.filter(t=>t.status===nFilter);
  const bucket=[];
  filtered.forEach(t=>{
    const c=matchCat(t), p=matchPhase(t);
    if(c===catKey&&p===phaseId)bucket.push(t);
  });
  return bucket[+idx]||null;
}
function findUncatTask(idx){
  const filtered=nFilter==='all'?nTasks:nTasks.filter(t=>t.status===nFilter);
  const uncat=filtered.filter(t=>!matchCat(t));
  return uncat[+idx]||null;
}

// Event delegation for Notion tab (attached once)
const _nc=document.getElementById('notionContent');

// Click events
_nc.addEventListener('click',e=>{
  // Filter buttons
  if(e.target.classList.contains('n-fbtn')){nFilter=e.target.dataset.nf;renderNotion();return}
  // Edit toggle
  if(e.target.id==='nEditToggle'||e.target.closest('#nEditToggle')){
    nEditMode=!nEditMode;
    // 페이지 타이틀, 서브타이틀, 탭 이름 편집 전환
    document.getElementById('pageTitle').contentEditable=nEditMode;
    document.getElementById('pageSub').contentEditable=nEditMode;
    document.querySelectorAll('.tab-label').forEach(el=>el.contentEditable=nEditMode);
    // 편집 모드 시각적 표시
    const editEls=[document.getElementById('pageTitle'),document.getElementById('pageSub'),...document.querySelectorAll('.tab-label')];
    editEls.forEach(el=>{if(nEditMode){el.style.border='1px dashed var(--accent)';el.style.borderRadius='4px';el.style.padding='2px 6px'}else{el.style.border='';el.style.padding=''}});
    renderNotion();renderRR();toast(nEditMode?'편집 모드 ON':'편집 모드 OFF');return
  }
  // Transition table
  if(e.target.classList.contains('tr-del')){const i=+e.target.dataset.i;if(confirm('"'+trans[i].name+'" 삭제?')){trans.splice(i,1);toast('삭제');renderTR()}return}
  if(e.target.id==='trAddBtn'){trans.push({name:'새 업무',before:'현재 방식',mid:'과도기',after:'AX 전환 후'});renderTR();toast('추가');return}
  // Delete task in edit mode
  if(e.target.classList.contains('n-del-btn')){
    const d=e.target.dataset;
    const t=d.nc==='_uncat'?findUncatTask(d.ni):findNTask(d.nc,d.np,d.ni);
    if(t&&confirm('"'+t.title+'" 삭제?')){
      const syncTitle=t._origTitle||t.title;
      const idx=nTasks.indexOf(t);
      if(idx>-1){nTasks.splice(idx,1);toast('삭제');renderNotion();autoSave()}
    }
    return;
  }
  // Add task in edit mode
  if(e.target.classList.contains('n-add-task')){
    const d=e.target.dataset;
    const newTask={title:'새 과제',assignee:'',status:'plan',category:d.nc,phase:d.np==='p1'?'Phase 1':d.np==='p2'?'Phase 2':'Phase 3'};
    nTasks.push(newTask);
    toast('추가');renderNotion();
    autoSave();
    return;
  }
});

// Input events (inline editing + debounced sync)
_nc.addEventListener('input',e=>{
  const d=e.target.dataset;
  // ── Phase 헤더 편집 ──
  if(d.ped&&d.pi!=null){
    N_PERIODS[+d.pi][d.ped]=e.target.value;
    return;
  }
  // ── 카테고리 편집 ──
  if(d.ced&&d.ci!=null){
    CATS[+d.ci][d.ced]=e.target.value;
    if(e.target.tagName==='TEXTAREA') autoResize(e.target);
    return;
  }
  // ── 시간 바 편집 ──
  if(d.tbi!=null&&d.tbf){
    if(d.tsi!=null){
      // 세그먼트 편집
      if(d.tbf==='pct') timeBars[+d.tbi].segments[+d.tsi].pct=+e.target.value||0;
      else timeBars[+d.tbi].segments[+d.tsi][d.tbf]=e.target.value;
    } else {
      // 바 타이틀 편집
      timeBars[+d.tbi][d.tbf]=e.target.value;
    }
    return;
  }
  // ── 과제 편집 (기존) ──
  if(d.nf&&d.nc!=null&&d.ni!=null){
    const t=d.nc==='_uncat'?findUncatTask(d.ni):findNTask(d.nc,d.np,d.ni);
    if(t){
      if(!t._origTitle) t._origTitle=t.title;
      t[d.nf]=e.target.value;
      autoSave();
    }
  }
});

// Change events (status select + time bar pct + immediate sync)
_nc.addEventListener('change',e=>{
  // 시간 바 비율 변경 → 리렌더
  const d=e.target.dataset;
  if(d.tbi!=null&&d.tbf==='pct'){renderNotion();return}
  if(!e.target.classList.contains('n-st-sel'))return;
  const t=d.nc==='_uncat'?findUncatTask(d.ni):findNTask(d.nc,d.np,d.ni);
  if(t){
    if(!t._origTitle) t._origTitle=t.title;
    t.status=e.target.value;
    toast(t.title+' → '+SL[e.target.value]);
    renderNotion();
    autoSave();
  }
});

// ── 드래그 앤 드롭 ──
function initDragDrop(){
  let dragIdx=null;
  const cards=document.querySelectorAll('.ng-card.draggable');
  const zones=document.querySelectorAll('.drop-zone');

  cards.forEach(card=>{
    card.addEventListener('dragstart',e=>{
      dragIdx=+card.dataset.dragIdx;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',dragIdx);
    });
    card.addEventListener('dragend',()=>{
      card.classList.remove('dragging');
      zones.forEach(z=>z.classList.remove('drag-over'));
    });
  });

  zones.forEach(zone=>{
    zone.addEventListener('dragover',e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      zone.classList.add('drag-over');
    });
    zone.addEventListener('dragleave',()=>{
      zone.classList.remove('drag-over');
    });
    zone.addEventListener('drop',e=>{
      e.preventDefault();
      zone.classList.remove('drag-over');
      const idx=+e.dataTransfer.getData('text/plain');
      if(isNaN(idx)||idx<0||idx>=nTasks.length)return;

      const task=nTasks[idx];
      const newCat=zone.dataset.dzCat;
      const newPhase=zone.dataset.dzPhase;

      // 카테고리 변경 → category 필드 업데이트
      task.category=newCat;

      // Phase 변경 → phase + status 업데이트
      if(newPhase==='p1'){task.phase='Phase 1';task.status='done'}
      else if(newPhase==='p2'){task.phase='Phase 2';task.status='prog'}
      else{task.phase='Phase 3';task.status='plan'}

      toast(task.title+' → '+newCat+' / '+N_PERIODS.find(p=>p.id===newPhase).label);

      autoSave();
      renderNotion();
    });
  });
}

// ═══ INIT ═══
// 클라우드(Google Sheets) → 캐시(localStorage) → 기본 데이터 순서로 로드
