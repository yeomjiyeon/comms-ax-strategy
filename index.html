<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F&F Comms AX Strategy</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{--bg:#111015;--s:#1a1820;--s2:#221f2a;--bd:rgba(255,255,255,0.06);--bdh:rgba(255,255,255,0.12);--neon:#C9B458;--nd:rgba(201,180,88,0.08);--nb:rgba(201,180,88,0.2);--green:#3EB890;--grd:rgba(45,212,160,0.1);--grb:rgba(45,212,160,0.2);--blue:#7B93D4;--bld:rgba(108,142,239,0.1);--blb:rgba(108,142,239,0.2);--amber:#D4994A;--purple:#9484C4;--red:#D46B6B;--t:#F0EEF6;--ts:#a09bb2;--td:#6e6a80}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;font-size:16px}
.page{max-width:1600px;margin:0 auto;padding:48px 52px 100px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.mc{background:var(--s);border-radius:16px;padding:20px 18px;border:1px solid var(--bd);position:relative;overflow:hidden}
.mc-bar{position:absolute;top:0;left:0;right:0;height:3px;opacity:.6}
.mc-label{font-size:13px;color:var(--td);font-weight:500;margin-bottom:6px}
.mc-val{font-size:42px;font-weight:800;letter-spacing:-2px;line-height:1}
.mc-sub{font-size:12px;color:var(--td);margin-top:8px}
.mc-prog{height:4px;border-radius:2px;background:rgba(255,255,255,0.04);margin-top:12px;overflow:hidden}
.mc-prog-fill{height:100%;border-radius:2px;opacity:.6;transition:width .8s}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:36px}
.card{background:var(--s);border-radius:20px;padding:18px;border:1px solid var(--bd)}
.card-title{font-size:14px;font-weight:600;color:var(--ts);margin-bottom:10px}
.sec-title{font-size:20px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.sec-bar{width:4px;height:22px;border-radius:2px}
.team-lead{background:linear-gradient(135deg,var(--s) 0%,var(--s2) 100%);border-radius:22px;padding:36px 40px;border:1px solid var(--bd);display:flex;align-items:center;gap:28px;margin-bottom:16px;position:relative;overflow:hidden}
.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tm-card{background:var(--s);border-radius:20px;padding:26px 22px;border:1px solid var(--bd);position:relative;overflow:hidden}
.tm-stripe{position:absolute;top:0;left:0;right:0;height:3px}
.avatar{border-radius:50%;object-fit:cover;border:2px solid rgba(212,245,66,0.3);flex-shrink:0}
.av-fallback{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#111;flex-shrink:0;background:linear-gradient(135deg,#C9B458,#E8B931)}
.pill{font-size:13px;color:var(--ts);padding:7px 18px;border-radius:24px;background:var(--nd);border:1px solid var(--nb)}
.duty{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.duty-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.duty-text{font-size:14px;color:var(--ts)}
.vision-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:16px}
.v-card{background:var(--s);border-radius:20px;padding:26px 20px;border:1px solid var(--bd);position:relative;overflow:hidden}
.v-stripe{position:absolute;top:0;left:0;right:0;height:3px;opacity:.5}
.v-icon{font-size:28px;margin-bottom:12px}
.v-title{font-size:16px;font-weight:600;margin-bottom:14px}
.v-item{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.v-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:7px;opacity:.7}
.v-text{font-size:13px;color:var(--ts);line-height:1.5}
.comp-bar{background:var(--s);border-radius:18px;padding:22px 20px;border:1px solid var(--bd)}
.comp-bar-inner{display:flex;height:52px;border-radius:10px;overflow:hidden;gap:2px}
.comp-seg{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;opacity:.85}
.comp-legend{display:flex;gap:18px;margin-top:14px}
.comp-legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--td)}
.comp-legend-dot{width:8px;height:8px;border-radius:2px;opacity:.85}
.phase-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.ph-col{background:var(--s);border-radius:20px;border:2px solid var(--bd);overflow:hidden;transition:border-color .2s}
.ph-col.drag-over{border-color:currentColor}
.ph-hdr{padding:20px 22px;border-bottom:1px solid var(--bd)}
.ph-body{padding:14px}
.task-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;margin-bottom:4px;border:1px solid transparent}
.task-card.editing{background:rgba(255,255,255,0.02);border:1px solid var(--bd);cursor:grab}
.task-card.dragging{opacity:.4}
.task-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.task-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-who{font-size:12px;color:var(--td);margin-top:2px}
.add-btn{width:100%;padding:12px;border-radius:10px;border:1px dashed;background:transparent;font-size:13px;font-weight:500;cursor:pointer;margin-top:6px;opacity:.6;transition:opacity .2s}
.add-btn:hover{opacity:1}
.del-btn{width:28px;height:28px;border-radius:8px;border:none;background:rgba(248,113,113,0.15);color:var(--red);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.edit-input{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:var(--t);padding:5px 8px;font-size:14px;width:100%;outline:none;font-family:inherit}
.edit-select{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:var(--t);padding:5px 8px;font-size:13px;outline:none;font-family:inherit;cursor:pointer;appearance:none;-webkit-appearance:none}
.edit-btn{padding:10px 24px;border-radius:24px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--nb);transition:all .2s;font-family:inherit}
.edit-btn.on{background:var(--neon);color:#111}
.edit-btn.off{background:transparent;color:var(--neon)}
.footer{margin-top:60px;padding-top:24px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;font-size:13px;color:var(--td)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--neon);color:#111;padding:14px 32px;border-radius:12px;font-size:15px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
.tabs{display:flex;gap:0;margin-bottom:36px;border-bottom:2px solid var(--bd)}
.tab{padding:14px 36px;font-size:16px;font-weight:600;color:var(--td);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab:hover{color:var(--ts)}
.tab.active{color:var(--neon);border-bottom-color:var(--neon)}
</style>
</head>

    charts.bar=new Chart(barCtx,{type:'bar',data:{labels:['콘텐츠','이슈관리','PR/MPR','KPI','ESG'],datasets:[{label:'완료',data:[1,2,2,0,0],backgroundColor:'#3EB890'},{label:'진행 중',data:[3,2,3,3,0],backgroundColor:'#7B93D4'},{label:'예정',data:[1,1,2,1,2],backgroundColor:'#C9B458'}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,scales:{x:{display:false,stacked:true},y:{stacked:true,ticks:{color:'#6e6a80',font:{size:11}},grid:{display:false},border:{display:false}}},plugins:{legend:{display:false},tooltip:{backgroundColor:'#221f2a',borderColor:'rgba(255,255,255,0.12)',borderWidth:1,titleColor:'#F0EEF6',bodyColor:'#a09bb2',cornerRadius:10}}}});
  }
  const pieCtx=document.getElementById('pieChart');
  if(pieCtx){
    charts.pie=new Chart(pieCtx,{type:'doughnut',data:{labels:['완료','진행 중','개발 예정'],datasets:[{data:[done,prog,plan],backgroundColor:['#3EB890','#7B93D4','#C9B458'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:false},tooltip:{backgroundColor:'#221f2a',borderColor:'rgba(255,255,255,0.12)',borderWidth:1,titleColor:'#F0EEF6',bodyColor:'#a09bb2',cornerRadius:10}}}});

function switchTab(tab){activeTab=tab;render()}
function updTask(i,f,v){tasks[i][f]=v;render();autoSave()}
function delTask(i){if(confirm('"'+tasks[i].t+'" 삭제?')){tasks.splice(i,1);render();autoSave();toast('삭제')}}
function addTask(pid){const ph=PH.find(p=>p.id===pid);tasks.push({t:'새 과제',w:MEMBERS[0],s:ph.st,p:pid,cat:CATS[0].key});render();autoSave();toast('추가')}
function addTaskCat(phIdx,catIdx){var ph=PH[phIdx];var cat=CATS[catIdx];tasks.push({t:'새 과제',w:MEMBERS[0],s:ph.st,p:ph.id,cat:cat.key});render();autoSave();toast('추가')}

// Drag & Drop
function onDragStart(e,idx){dragIdx=idx;e.dataTransfer.effectAllowed='move'}
function onDragEnd(){dragIdx=null}
function dropToCell(catIdx,phIdx){if(dragIdx===null)return;var ph=PH[phIdx];var cat=CATS[catIdx];tasks[dragIdx].p=ph.id;tasks[dragIdx].s=ph.st;tasks[dragIdx].cat=cat.key;dragIdx=null;render();autoSave();toast('이동 완료')}

// Cloud Save/Load
function collectState(){return{tasks,savedAt:new Date().toISOString()}}
function applyState(state){
  if(state&&state.tasks&&state.tasks.length>0){
    // cat 필드가 없는 구버전 데이터면 무시
    var hasCat=state.tasks.some(function(t){return t.cat});
    if(!hasCat) return false;
    tasks=state.tasks;
    return true;
  }
  return false;
}
function saveToCache(state){try{localStorage.setItem(SKEY,JSON.stringify(state))}catch(e){}}
function loadFromCache(){try{const r=localStorage.getItem(SKEY);return r?JSON.parse(r):null}catch(e){return null}}

let _saveTimer=null;
function autoSave(){if(_saveTimer)clearTimeout(_saveTimer);_saveTimer=setTimeout(()=>{const state=collectState();saveToCache(state);saveToCloud(state)},1500)}

async function saveToCloud(state){
  try{
    const iframe=document.createElement('iframe');iframe.name='sf_'+Date.now();iframe.style.display='none';document.body.appendChild(iframe);
    const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target=iframe.name;form.style.display='none';
    const a=document.createElement('input');a.type='hidden';a.name='action';a.value='saveAll';form.appendChild(a);
    const d=document.createElement('input');d.type='hidden';d.name='data';d.value=JSON.stringify(state);form.appendChild(d);
    document.body.appendChild(form);form.submit();
    setTimeout(()=>{iframe.remove();form.remove()},5000);
  }catch(e){console.error('저장 오류:',e)}
}

async function loadFromCloud(){
  for(let i=0;i<3;i++){
    try{
      const r=await fetch(API_URL+'?action=loadAll');
      const text=await r.text();
      if(text.includes('<!DOCTYPE'))throw new Error('redirect');
      const d=JSON.parse(text);
      if(d.success&&d.state)return d.state;
      return null;
    }catch(e){if(i<2)await new Promise(r=>setTimeout(r,1500))}
  }
  return null;
}

const DEFAULT_TASKS=JSON.parse(JSON.stringify(tasks));

async function init(){
  try{
    const cached=loadFromCache();
    if(cached && cached.tasks && cached.tasks.length > 0) applyState(cached);
  }catch(e){}
  if(tasks.length===0) tasks=JSON.parse(JSON.stringify(DEFAULT_TASKS));
  render();
  try{
    const cloud=await loadFromCloud();
    if(cloud && cloud.tasks && cloud.tasks.length > 0){applyState(cloud);saveToCache(cloud);render()}
  }catch(e){}
  if(tasks.length===0){tasks=JSON.parse(JSON.stringify(DEFAULT_TASKS));render()}
}
init();
</script>
